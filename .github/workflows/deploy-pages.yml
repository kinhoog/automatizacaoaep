name: Publicar frontend no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar frontend
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v6

      - name: Validar URL e gerar configuração pública
        env:
          AEP_API_BASE_URL: ${{ vars.AEP_API_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const rawValue = (process.env.AEP_API_BASE_URL || "").trim();
          let content;
          if (!rawValue) {
            content =
              'window.AEP_CONFIG = Object.freeze({ API_BASE_URL: "" });\n';
          } else {
            const url = new URL(rawValue);
            if (
              url.protocol !== "https:" ||
              url.username ||
              url.password ||
              url.search ||
              url.hash
            ) {
              throw new Error(
                "AEP_API_BASE_URL deve ser uma URL HTTPS sem credenciais.",
              );
            }
            const apiBaseUrl = rawValue.replace(/\/+$/, "");
            content =
              "window.AEP_CONFIG = Object.freeze({ API_BASE_URL: " +
              JSON.stringify(apiBaseUrl) +
              " });\n";
          }
          fs.writeFileSync("frontend/config.js", content, "utf8");

          const revision = (process.env.GITHUB_SHA || "local").slice(0, 12);
          for (const file of fs.readdirSync("frontend")) {
            if (!file.endsWith(".html")) continue;
            const htmlPath = `frontend/${file}`;
            const html = fs
              .readFileSync(htmlPath, "utf8")
              .replace(/\?v=0\.6\.0/g, `?v=${revision}`);
            fs.writeFileSync(htmlPath, html, "utf8");
          }
          NODE

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar frontend estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

  deploy:
    name: Publicar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
